<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ミライ予想</title>
<meta name="description" content="毎日1問、友達とAIに勝負する無料の予想ゲーム" />
<style>
:root{
  --bg:#f4f5fb; --card:#ffffff; --text:#1c1f2e; --sub:#6b7085; --line:#e5e7f0;
  --brand:#3b3fd8; --brand-soft:#e9eafc; --yes:#16a34a; --yes-soft:#e3f6ea; --no:#dc2626; --no-soft:#fde8e8;
  --gold:#d97706; --shadow:0 4px 18px rgba(20,24,60,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1120; --card:#1a1d31; --text:#eef0fa; --sub:#a0a5be; --line:#2c3050;
    --brand:#8b8ffb; --brand-soft:#262a52; --yes:#4ade80; --yes-soft:#16301f; --no:#f87171; --no-soft:#3a1a1d;
    --gold:#fbbf24; --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.logo{font-weight:800;font-size:22px;letter-spacing:.02em}
.logo span{color:var(--brand)}
.who{font-size:13px;color:var(--sub);text-align:right}
.who b{color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.label{display:inline-block;font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:2px 10px}
.q{font-size:19px;font-weight:700;margin:10px 0 4px}
.meta{font-size:12px;color:var(--sub)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{border:none;border-radius:12px;padding:14px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-yes{background:var(--yes-soft);color:var(--yes);border:2px solid transparent}
.btn-no{background:var(--no-soft);color:var(--no);border:2px solid transparent}
.btn-yes.on{border-color:var(--yes)} .btn-no.on{border-color:var(--no)}
.conf{display:flex;gap:8px;margin-top:12px}
.conf button{flex:1;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:8px 4px;font-size:13px;cursor:pointer;font-family:inherit}
.conf button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.conf small{display:block;color:inherit;opacity:.75;font-size:11px}
.primary{width:100%;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;margin-top:14px;cursor:pointer;font-family:inherit}
.primary:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.vs > div{border-radius:12px;padding:12px;background:var(--bg)}
.vs h4{margin:0 0 4px;font-size:13px;color:var(--sub)}
.pick{font-size:18px;font-weight:800}
.pick.yes{color:var(--yes)} .pick.no{color:var(--no)}
.reason{font-size:13px;color:var(--sub);margin-top:6px}
.result{margin-top:12px;padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px}
.result.win{background:var(--yes-soft);color:var(--yes)}
.result.lose{background:var(--no-soft);color:var(--no)}
.result.wait{background:var(--brand-soft);color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--sub);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.me-row td{color:var(--brand)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;border:none;color:var(--sub);padding:10px 0 14px;font-size:11px;cursor:pointer;font-family:inherit}
nav button i{display:block;font-style:normal;font-size:22px}
nav button.on{color:var(--brand);font-weight:700}
.share{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;font-size:14px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mini{border-top:1px solid var(--line);padding:12px 0}
.mini:first-child{border-top:none;padding-top:0}
.mini .t{font-weight:700;font-size:15px}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;margin-left:4px}
.tag.yes{background:var(--yes-soft);color:var(--yes)} .tag.no{background:var(--no-soft);color:var(--no)}
.banner{background:#fff4d6;color:#7a4b00;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
@media (prefers-color-scheme: dark){.banner{background:#3a2c08;color:#fcd98a}}
.modal{position:fixed;inset:0;background:rgba(10,12,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{max-width:440px;width:100%;margin:0}
.step-ill{font-size:56px;text-align:center;margin:6px 0}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
.note{font-size:12px;color:var(--sub);margin-top:8px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--brand)}
footer{font-size:12px;color:var(--sub);margin-top:24px;line-height:1.7}
h2{font-size:17px;margin:18px 0 10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🔮 ミライ<span>予想</span></div>
    <div class="who" id="who"></div>
  </header>
  <div id="demoBanner"></div>
  <main id="view"></main>
  <footer>
    ・参加は無料です。ポイントはゲームの中だけで使うもので、お金や商品とは交換できません。<br>
    ・試作版のため、データはこの端末（ブラウザ）の中だけに保存されます。<br>
    ・ニックネームには本名や連絡先を入れないでください。<br>
    ・「AIミライくん」の予想は、試作版ではあらかじめ用意したルールで作っています。<br>
    <button class="ghost" style="margin-top:8px" onclick="toggleDemo()" id="demoBtn">結果発表をお試し（デモ）</button>
    <button class="ghost" style="margin-top:8px" onclick="showHelp(0)">遊び方</button>
  </footer>
</div>
<nav><div class="in" id="nav"></div></nav>
<div id="overlay"></div>

<script src="data.js"></script>
<script>
// ===== 基本設定 =====
const KEY = 'mirai-yosou-v1';
const POINTS_WIN = [10, 20, 30];   // 自信度ごとの「当たり」の点
const POINTS_LOSE = [0, -10, -20]; // 自信度ごとの「はずれ」の点
const CONF_LABEL = ['ふつう', '自信あり', '絶対！'];
const AI_NAME = 'AIミライくん';
const TABS = [
  { id: 'today', icon: '📅', label: '今日の1問' },
  { id: 'special', icon: '🎍', label: '年末SP' },
  { id: 'battle', icon: '⚔️', label: '友達と対戦' },
  { id: 'record', icon: '🏆', label: '成績' },
];

// ===== 保存（この端末の中だけ） =====
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
let state = Object.assign({ name: '', picks: {}, friends: {}, demo: false, helped: false }, load());
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

// ===== 日付（日本時間） =====
function jst(d = new Date()) { return new Date(d.getTime() + 9 * 3600e3); }
function ymd(d) { return d.toISOString().slice(0, 10); }
function todayStr() { return ymd(jst()); }
function addDays(str, n) { const d = new Date(str + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return ymd(d); }
function md(str) { const [, m, d] = str.split('-'); return `${+m}月${+d}日`; }
function wd(str) { return '日月火水木金土'[new Date(str + 'T00:00:00Z').getUTCDay()]; }
function hash(s) { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ===== 毎日の1問（自動で作る） =====
// 出題日 D の問題は「翌日 D+1 のこと」を聞き、締め切りは D の23:59
const AVG_MAX_TEMP = [10, 11, 14, 19, 23, 26, 30, 31, 27, 22, 17, 12]; // 東京の平年の最高気温（めやす）
function dailyQuestion(dateStr) {
  const target = addDays(dateStr, 1);
  const dow = new Date(target + 'T00:00:00Z').getUTCDay();
  const weekend = dow === 0 || dow === 6;
  const n = Math.floor(new Date(dateStr + 'T00:00:00Z').getTime() / 864e5);
  const type = weekend ? 'weather' : ['stock', 'fx', 'weather'][n % 3];
  const h = hash(dateStr);
  const base = { id: 'd-' + dateStr, date: dateStr, deadline: dateStr + 'T23:59:00+09:00' };
  const when = `明日（${md(target)}・${wd(target)}）`;
  if (type === 'stock') return { ...base, cat: '経済', icon: '📈',
    text: `${when}の日経平均株価は、前の日より上がって終わる？`,
    ai: { pick: 'yes', conf: 1, reason: '長い目で見ると、株価は上がる日のほうが少しだけ多いので「はい」と予想します。' } };
  if (type === 'fx') { const pick = h % 2 ? 'yes' : 'no'; return { ...base, cat: '為替', icon: '💱',
    text: `${when}の夕方、前の日より「円高」になっている？`,
    ai: { pick, conf: 1, reason: '為替の1日の動きはほぼ五分五分。今回は直感で決めました。' } }; }
  const t = AVG_MAX_TEMP[+target.slice(5, 7) - 1];
  const pick = h % 3 === 0 ? 'no' : 'yes';
  return { ...base, cat: '天気', icon: '☀️',
    text: `${when}の東京都心の最高気温は、${t}℃以上になる？`,
    ai: { pick, conf: 1, reason: `${t}℃はこの時期の平年並みの気温。最近の傾向から「${pick === 'yes' ? 'はい' : 'いいえ'}」と見ています。` } };
}
function recentDaily(days = 7) {
  const out = []; const t = todayStr();
  for (let i = 0; i < days; i++) out.push(dailyQuestion(addDays(t, -i)));
  return out;
}
function allQuestions() { return [...recentDaily(14), ...window.SPECIAL_QUESTIONS]; }
function qById(id) { return allQuestions().find(q => q.id === id); }
function isOpen(q) { return Date.now() < new Date(q.deadline).getTime(); }

// ===== 結果と採点 =====
function resultOf(q) {
  if (window.RESULTS[q.id]) return window.RESULTS[q.id];
  if (state.demo) return hash(q.id + 'demo') % 2 ? 'yes' : 'no'; // デモ用の仮の結果
  return null;
}
function pointsFor(p, res) {
  if (!p || !res) return null;
  return p.pick === res ? POINTS_WIN[p.conf - 1] : POINTS_LOSE[p.conf - 1];
}
function tally(picksOf) { // picksOf(q) => {pick, conf} | undefined
  let pts = 0, hit = 0, done = 0, answered = 0;
  for (const q of allQuestions()) {
    const p = picksOf(q); if (!p) continue; answered++;
    const res = resultOf(q); if (!res) continue;
    done++; pts += pointsFor(p, res); if (p.pick === res) hit++;
  }
  return { pts, hit, done, answered };
}
function streak() {
  let s = 0; let d = todayStr();
  if (!state.picks['d-' + d]) d = addDays(d, -1); // 今日まだ答えていなくても、昨日までの連続は数える
  while (state.picks['d-' + d]) { s++; d = addDays(d, -1); }
  return s;
}

// ===== 画面の部品 =====
const pickWord = p => p === 'yes' ? 'はい' : 'いいえ';
function draft() { return window.__draft || (window.__draft = {}); }

function questionCard(q, big) {
  const mine = state.picks[q.id];
  const res = resultOf(q);
  const open = isOpen(q);
  const dl = new Date(q.deadline);
  const dlText = `締め切り ${dl.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`;
  let body = '';
  if (!mine && open) {
    const d = draft()[q.id] || {};
    body = `
      <div class="btns">
        <button class="btn btn-yes ${d.pick === 'yes' ? 'on' : ''}" onclick="setDraft('${q.id}','pick','yes')">⭕ はい</button>
        <button class="btn btn-no ${d.pick === 'no' ? 'on' : ''}" onclick="setDraft('${q.id}','pick','no')">❌ いいえ</button>
      </div>
      <div class="conf">${CONF_LABEL.map((l, i) => `
        <button class="${d.conf === i + 1 ? 'on' : ''}" onclick="setDraft('${q.id}','conf',${i + 1})">${l}<small>当たり +${POINTS_WIN[i]} / はずれ ${POINTS_LOSE[i]}</small></button>`).join('')}
      </div>
      <button class="primary" ${d.pick && d.conf ? '' : 'disabled'} onclick="submitPick('${q.id}')">この予想で決定</button>
      <div class="note">決定すると、AIミライくんの予想が見られます。</div>`;
  } else if (!mine && !open) {
    body = `<div class="result wait">締め切りを過ぎました（予想していません）</div>`;
  } else {
    let r;
    if (!res) r = `<div class="result wait">⏳ 結果待ち</div>`;
    else {
      const me = pointsFor(mine, res), ai = pointsFor(q.ai, res);
      const verdict = me > ai ? '🎉 AIに勝ち！' : me < ai ? '😢 AIに負け…' : '🤝 引き分け';
      r = `<div class="result ${mine.pick === res ? 'win' : 'lose'}">結果：${pickWord(res)} ／ あなた ${me > 0 ? '+' : ''}${me}点・AI ${ai > 0 ? '+' : ''}${ai}点　${verdict}</div>`;
    }
    body = `
      <div class="vs">
        <div><h4>あなた</h4><div class="pick ${mine.pick}">${pickWord(mine.pick)}</div><div class="meta">${CONF_LABEL[mine.conf - 1]}</div></div>
        <div><h4>🤖 ${AI_NAME}</h4><div class="pick ${q.ai.pick}">${pickWord(q.ai.pick)}</div><div class="meta">${CONF_LABEL[q.ai.conf - 1]}</div></div>
      </div>
      <div class="reason">🤖「${esc(q.ai.reason)}」</div>${r}`;
  }
  return `<div class="card">
    <span class="label">${q.icon} ${q.cat}</span>
    <div class="q" style="${big ? '' : 'font-size:17px'}">${esc(q.text)}</div>
    <div class="meta">${open ? dlText : '締め切り済み'}</div>
    ${body}
  </div>`;
}

// ===== 各タブ =====
function viewToday() {
  const [q, ...past] = recentDaily(7);
  const s = streak();
  let html = `<div class="stats">
    <div class="stat"><b>🔥${s}</b><span>連続予想（日）</span></div>
    <div class="stat"><b>${tally(x => state.picks[x.id]).pts}</b><span>あなたの点数</span></div>
    <div class="stat"><b>${tally(x => state.picks[x.id] ? x.ai : undefined).pts}</b><span>AIの点数</span></div>
  </div>`;
  html += `<h2>📅 今日の1問</h2>` + questionCard(q, true);
  if (state.picks[q.id]) html += shareCard();
  const answered = past.filter(x => state.picks[x.id]);
  if (answered.length) html += `<h2>これまでの予想</h2>` + answered.map(x => questionCard(x)).join('');
  return html;
}
function viewSpecial() {
  return `<h2>🎍 年末スペシャル</h2>
    <div class="note" style="margin:-4px 0 12px">年末年始の大きなイベントを予想しよう。友達との対戦にもカウントされます。</div>`
    + window.SPECIAL_QUESTIONS.map(q => questionCard(q)).join('');
}
function viewBattle() {
  const link = inviteLink();
  const rows = [
    { name: state.name + '（あなた）', me: true, ...tally(x => state.picks[x.id]) },
    { name: '🤖 ' + AI_NAME, ...tally(x => state.picks[x.id] ? x.ai : undefined) },
    ...Object.entries(state.friends).map(([n, f]) => ({ name: n, ...tally(x => decodePick(f.p[x.id])) })),
  ].sort((a, b) => b.pts - a.pts);
  let html = `<h2>⚔️ 友達と対戦</h2>
  <div class="card">
    <div class="t" style="font-weight:700">1. 招待リンクを友達に送る</div>
    <div class="note">リンクには「ニックネーム」と「あなたの予想」だけが入ります。友達が開くと、あなたとの対戦が始まります。</div>
    <div class="row">
      <a class="ghost" style="text-decoration:none" href="https://line.me/R/msg/text/?${encodeURIComponent('ミライ予想で勝負しよう！\n' + link)}" target="_blank" rel="noopener">LINEで送る</a>
      <button class="ghost" onclick="shareInvite()">リンクをコピー・共有</button>
    </div>
    <div class="note">※予想を追加したら、もう一度リンクを送り合うと最新の予想で比べられます。</div>
  </div>
  <div class="card">
    <div style="font-weight:700">2. ランキング</div>
    <table><tr><th>順位</th><th>名前</th><th style="text-align:right">的中</th><th style="text-align:right">点数</th></tr>
    ${rows.map((r, i) => `<tr class="${r.me ? 'me-row' : ''}"><td>${i + 1}</td><td>${esc(r.name)}</td><td class="num">${r.hit}/${r.done}</td><td class="num">${r.pts}</td></tr>`).join('')}
    </table>
    ${Object.keys(state.friends).length ? '' : '<div class="note">まだ友達がいません。上のリンクを送ってみよう！</div>'}
  </div>`;
  for (const [n, f] of Object.entries(state.friends)) {
    const common = allQuestions().filter(q => f.p[q.id] || state.picks[q.id]);
    if (!common.length) continue;
    html += `<div class="card"><div style="font-weight:700">あなた vs ${esc(n)}</div>` + common.map(q => {
      const a = state.picks[q.id], b = decodePick(f.p[q.id]), res = resultOf(q);
      const show = p => p ? `<span class="tag ${p.pick}">${pickWord(p.pick)}</span>` : '<span class="meta">未回答</span>';
      return `<div class="mini"><div class="t">${q.icon} ${esc(q.text)}</div>
        <div class="meta">あなた ${show(a)}　${esc(n)} ${show(b)}　${res ? '結果：' + pickWord(res) : '⏳結果待ち'}</div></div>`;
    }).join('') + `<div class="row"><button class="ghost" onclick="removeFriend('${encodeURIComponent(n)}')">この友達を削除</button></div></div>`;
  }
  return html;
}
function viewRecord() {
  const me = tally(x => state.picks[x.id]), ai = tally(x => state.picks[x.id] ? x.ai : undefined);
  const rate = me.done ? Math.round(me.hit / me.done * 100) : 0;
  const title = me.done < 5 ? '見習い予想士' : rate >= 70 ? '🔮 予想の達人' : rate >= 55 ? '⭐ なかなかの予想士' : '🌱 成長中の予想士';
  return `<h2>🏆 あなたの成績</h2>
  <div class="stats">
    <div class="stat"><b>${rate}%</b><span>的中率</span></div>
    <div class="stat"><b>${me.answered}</b><span>予想した数</span></div>
    <div class="stat"><b>🔥${streak()}</b><span>連続日数</span></div>
  </div>
  <div class="card">
    <div class="meta">あなたの称号</div><div class="q">${title}</div>
    <div class="note">結果が出た問題が5問以上になると、的中率で称号が決まります。</div>
  </div>
  <div class="card">
    <div style="font-weight:700">AIミライくんとの勝負</div>
    <table><tr><th></th><th style="text-align:right">的中</th><th style="text-align:right">点数</th></tr>
      <tr class="me-row"><td>あなた</td><td class="num">${me.hit}/${me.done}</td><td class="num">${me.pts}</td></tr>
      <tr><td>🤖 ${AI_NAME}</td><td class="num">${ai.hit}/${ai.done}</td><td class="num">${ai.pts}</td></tr>
    </table>
    <div class="note">${me.done === 0 ? '結果が出ると、ここで勝ち負けが分かります。' : me.pts > ai.pts ? 'あなたがリードしています！' : me.pts < ai.pts ? 'AIがリード中。巻き返そう！' : '互角の勝負です。'}</div>
  </div>
  <div class="card">
    <div style="font-weight:700">ニックネーム</div>
    <div class="row"><input type="text" id="rename" maxlength="12" value="${esc(state.name)}"><button class="ghost" onclick="rename()">変更</button></div>
    <div class="note">本名や連絡先は入れないでください。</div>
  </div>`;
}

// ===== シェア用の絵文字 =====
function shareText() {
  const qs = recentDaily(7).reverse();
  const mark = (p, q) => { const res = resultOf(q); if (!p) return '⬜'; if (!res) return '⏳'; return p.pick === res ? '🟢' : '🔴'; };
  const me = qs.map(q => mark(state.picks[q.id], q)).join('');
  const ai = qs.map(q => mark(q.ai, q)).join('');
  return `🔮ミライ予想 ${md(todayStr())}\nわたし ${me}\nAI　　 ${ai}\n🔥連続${streak()}日\n#ミライ予想`;
}
function shareCard() {
  return `<div class="card"><div style="font-weight:700">結果をシェアしよう</div>
    <div class="share">${esc(shareText())}</div>
    <div class="row"><button class="ghost" onclick="shareResult()">コピー・共有する</button>
    <a class="ghost" style="text-decoration:none" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText() + '\n' + baseUrl())}">Xに投稿</a></div></div>`;
}

// ===== 招待リンク（予想を URL に入れて渡す） =====
function baseUrl() { return location.origin + location.pathname; }
function b64(s) { return btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))); }
function encodePick(p) { return (p.pick === 'yes' ? 'y' : 'n') + p.conf; }
function decodePick(s) { if (!s || !/^[yn][123]$/.test(s)) return undefined; return { pick: s[0] === 'y' ? 'yes' : 'no', conf: +s[1] }; }
function inviteLink() {
  const p = {}; for (const [id, v] of Object.entries(state.picks)) p[id] = encodePick(v);
  return baseUrl() + '#vs=' + b64(JSON.stringify({ n: state.name, p }));
}
function readInvite() {
  const m = location.hash.match(/vs=([\w-]+)/); if (!m) return;
  try {
    const d = JSON.parse(unb64(m[1]));
    const n = String(d.n || '').slice(0, 12).trim();
    if (n && typeof d.p === 'object') {
      const name = n === state.name ? n + '（友達）' : n;
      state.friends[name] = { p: d.p, at: Date.now() }; save();
      toast(`${n}さんとの対戦が始まりました！`);
      current = 'battle';
    }
  } catch { toast('招待リンクを読み込めませんでした'); }
  history.replaceState(null, '', baseUrl());
}

// ===== 操作 =====
let current = 'today';
function setDraft(id, k, v) { draft()[id] = { ...(draft()[id] || {}), [k]: v }; render(); }
function submitPick(id) {
  const d = draft()[id]; const q = qById(id);
  if (!d || !d.pick || !d.conf || !q || !isOpen(q)) return;
  state.picks[id] = { pick: d.pick, conf: d.conf, at: Date.now() }; save();
  toast(d.pick === q.ai.pick ? 'AIと同じ予想です' : 'AIと反対の予想！勝負です');
  render();
}
async function copyOrShare(text) {
  if (navigator.share) { try { await navigator.share({ text }); return; } catch {} }
  try { await navigator.clipboard.writeText(text); toast('コピーしました'); } catch { prompt('このテキストをコピーしてください', text); }
}
function shareResult() { copyOrShare(shareText() + '\n' + baseUrl()); }
function shareInvite() { copyOrShare('ミライ予想で勝負しよう！\n' + inviteLink()); }
function removeFriend(n) { delete state.friends[decodeURIComponent(n)]; save(); render(); }
function rename() {
  const v = document.getElementById('rename').value.trim().slice(0, 12);
  if (!v) return; state.name = v; save(); toast('変更しました'); render();
}
function toggleDemo() { state.demo = !state.demo; save(); toast(state.demo ? 'デモの結果を表示中' : 'デモを終了しました'); render(); }
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
}

// ===== 遊び方（3ステップ） =====
const HELP = [
  { ill: '🔮', t: '1. 予想する', d: '毎日1問、「はい」か「いいえ」で答えます。自信度も選べます。自信があるほど、当たると高得点、はずれると減点です。' },
  { ill: '🤖', t: '2. AIと勝負', d: '予想を決めると、AIミライくんの予想と理由が見られます。AIより高い点数を目指そう！' },
  { ill: '⚔️', t: '3. 友達と対戦', d: '招待リンクを送ると、友達とランキングで競えます。結果は絵文字でシェアできます。参加は無料、ポイントはお金と交換できません。' },
];
function showHelp(i) {
  const h = HELP[i]; const last = i === HELP.length - 1;
  document.getElementById('overlay').innerHTML = `<div class="modal"><div class="card">
    <div class="step-ill">${h.ill}</div><div class="q">${h.t}</div><p>${h.d}</p>
    <div class="dots">${HELP.map((_, j) => `<span class="${j === i ? 'on' : ''}"></span>`).join('')}</div>
    <button class="primary" onclick="${last ? 'closeHelp()' : `showHelp(${i + 1})`}">${last ? 'はじめる' : '次へ'}</button>
  </div></div>`;
}
function closeHelp() {
  state.helped = true; save();
  document.getElementById('overlay').innerHTML = '';
  if (!state.name) askName();
}
function askName() {
  document.getElementById('overlay').innerHTML = `<div class="modal"><div class="card">
    <div class="q">ニックネームを決めよう</div>
    <input type="text" id="nameIn" maxlength="12" placeholder="例：みらい太郎">
    <div class="note">友達とのランキングに表示されます。本名や連絡先は入れないでください（12文字まで）。</div>
    <button class="primary" onclick="setName()">決定</button>
  </div></div>`;
  setTimeout(() => document.getElementById('nameIn')?.focus(), 50);
}
function setName() {
  const v = document.getElementById('nameIn').value.trim().slice(0, 12);
  if (!v) return toast('ニックネームを入れてください');
  state.name = v; save(); document.getElementById('overlay').innerHTML = '';
  readInvite(); render();
}

// ===== 描画 =====
function render() {
  document.getElementById('who').innerHTML = state.name ? `ようこそ<br><b>${esc(state.name)}</b> さん` : '';
  document.getElementById('demoBanner').innerHTML = state.demo
    ? '<div class="banner">🧪 デモ表示中：結果は仮のものです。「デモを終了」で元に戻ります。</div>' : '';
  document.getElementById('demoBtn').textContent = state.demo ? 'デモを終了' : '結果発表をお試し（デモ）';
  document.getElementById('nav').innerHTML = TABS.map(t =>
    `<button class="${t.id === current ? 'on' : ''}" onclick="go('${t.id}')"><i>${t.icon}</i>${t.label}</button>`).join('');
  const v = { today: viewToday, special: viewSpecial, battle: viewBattle, record: viewRecord }[current];
  document.getElementById('view').innerHTML = v();
}
function go(t) { current = t; render(); window.scrollTo(0, 0); }

render();
if (!state.helped) showHelp(0);
else if (!state.name) askName();
else readInvite(), render();
</script>
</body>
</html>
