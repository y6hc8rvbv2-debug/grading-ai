<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>テスト採点</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F6F4EF; color: #1f2328;
         font: 16px/1.8 -apple-system, system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  button { margin-top: 16px; padding: 12px 24px; font-size: 16px; border-radius: 12px; border: 0; background: #1E3A5F; color: #fff; }
</style>
</head>
<body>
<main>
  <h1 style="font-size:20px">インターネットにつながっていません</h1>
  <p>テスト採点は、インターネットにつながっているときに使えます。Wi-Fi やモバイル通信を確かめてから、もう一度お試しください。</p>
  <button type="button" onclick="location.reload()">もう一度読み込む</button>
</main>
</body>
</html>
