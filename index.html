<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>小学生テスト採点AI</title>

<style>
body{
font-family:sans-serif;
background:#f5f7fb;
padding:40px;
max-width:700px;
margin:auto;
}

.card{
background:white;
padding:24px;
border-radius:16px;
box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

button{
background:#4f46e5;
color:white;
border:none;
padding:12px 24px;
border-radius:12px;
cursor:pointer;
font-size:16px;
}

.score{
font-size:56px;
font-weight:bold;
color:#4f46e5;
}

.result{
margin-top:24px;
}

.loading{
color:#666;
}
</style>
</head>

<body>

<h1>📘 小学生テスト採点AI</h1>

<div class="card">

<input type="file" id="imageInput" />

<br><br>

<button onclick="gradeTest()">
採点する
</button>

<div class="result" id="result"></div>

</div>

<script>

async function gradeTest(){

const result = document.getElementById("result");

result.innerHTML =
"<div class='loading'>AIが採点中です...</div>";

try{

const response = await fetch("/api/grade",{
method:"POST"
});

const data = await response.json();

result.innerHTML = `
<div class="score">${data.score}点</div>
<p>${data.comment}</p>
`;

}catch(error){

result.innerHTML =
"エラーが発生しました";

}

}

</script>

</body>
</html>
