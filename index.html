    <script>
      try { var s = JSON.parse(localStorage.getItem('js-display') || '{}');
        var dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.accent = s.accent || 'teal';
        document.documentElement.dataset.size = s.size || 'md';
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
