# 検証用 Supabase（saiten-verify）に、新しいマイグレーションを自動で適用する（本番には使えない）。
#   - claude/** のブランチに supabase/migrations/ の変更を push したとき・手動（Actions → verify-db → Run workflow）で動く
#   - 中身は scripts/verify-db/apply.mjs（接続先は saiten-verify だけ・適用の前後で DB の状態を照合・食い違えば何もせず止まる）
#   - 鍵は GitHub の Secret「VERIFY_DB_URL」（検証用 DB だけの接続文字列。おすすめ）か「SUPABASE_ACCESS_TOKEN」（アカウント全体。以前の方法）。
#     VERIFY_DB_URL があればそちらだけを使う。どちらも無ければ、何もせずに成功で終わる（設定は docs/AUTO-PREVIEW.md）
name: verify-db

on:
  push:
    branches: ["claude/**"]
    paths: ["supabase/migrations/**", "supabase/runbook/**", "scripts/verify-db/**"]
  workflow_dispatch:
    inputs:
      at:
        description: "いまの番号（指紋だけでは決められないときだけ。例 0019。ふだんは空欄）"
        required: false
        default: ""

# 同時に2つ走らせない（あとから来たものは前の完了を待つ）
concurrency:
  group: verify-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 検証用 DB に適用（最新の番号まで）
        env:
          VERIFY_DB_URL: ${{ secrets.VERIFY_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.VERIFY_DB_URL == '' && secrets.SUPABASE_ACCESS_TOKEN || '' }}
          AT: ${{ github.event.inputs.at }}
        run: |
          if [ -z "$VERIFY_DB_URL" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Secret VERIFY_DB_URL（または SUPABASE_ACCESS_TOKEN）が無いので、検証用 DB への適用を省きました（docs/AUTO-PREVIEW.md）"
            exit 0
          fi
          if [ -n "$VERIFY_DB_URL" ]; then
            command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          else
            echo "::warning::アカウント全体を操作できる SUPABASE_ACCESS_TOKEN を使っています。検証用 DB だけの VERIFY_DB_URL に替えてください（docs/AUTO-PREVIEW.md）"
          fi
          if [ -n "$AT" ] && ! echo "$AT" | grep -qE '^[0-9]{4}$'; then echo "at は4桁の番号にしてください"; exit 1; fi
          node scripts/verify-db/apply.mjs --apply --to latest --confirm-ref cpfhsxbmzoyrlkynveqd ${AT:+--at "$AT"}
